<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bg" cx="35%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a3352"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="50%" y1="15%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2340"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M320 135 Q416 142 416 212 Q416 322 320 392 Q224 322 224 212 Q224 142 320 135Z"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Shield (left side) -->
  <g>
    <path d="M320 135 Q416 142 416 212 Q416 322 320 392 Q224 322 224 212 Q224 142 320 135Z"
          fill="url(#shieldFill)"/>
    <path d="M320 135 Q416 142 416 212 Q416 322 320 392 Q224 322 224 212 Q224 142 320 135Z"
          fill="none" stroke="#3b82f6" stroke-width="4"/>

    <!-- Waves clipped to shield -->
    <g clip-path="url(#shieldClip)">
      <path d="M200 215 Q240 190 260 215 Q280 240 300 215 Q320 190 340 215 Q360 240 380 215 Q400 190 420 215"
            fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M200 250 Q235 215 265 250 Q295 285 325 250 Q355 215 385 250 Q405 275 420 250"
            fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M200 280 Q235 255 265 280 Q295 305 325 280 Q355 255 385 280 Q405 295 420 280"
            fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M200 310 Q240 285 270 310 Q300 335 330 310 Q360 285 390 310 Q410 330 420 310"
            fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <path d="M200 340 Q230 325 255 340 Q280 355 305 340 Q330 325 355 340 Q380 355 405 340 Q420 330 420 340"
            fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>

  <!-- Text (right side) -->
  <text x="560" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-2">EdrShield</text>

  <text x="562" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" fill="#8b949e" letter-spacing="0.5">Protect your EDR from WFP silencing attacks</text>

  <!-- Feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <rect x="560" y="365" width="130" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f640" stroke-width="1"/>
    <text x="625" y="385" fill="#93c5fd" text-anchor="middle">WFP Defense</text>

    <rect x="700" y="365" width="130" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f640" stroke-width="1"/>
    <text x="765" y="385" fill="#93c5fd" text-anchor="middle">QoS Defense</text>

    <rect x="840" y="365" width="130" height="30" rx="6" fill="#1e3a5f" stroke="#3b82f640" stroke-width="1"/>
    <text x="905" y="385" fill="#93c5fd" text-anchor="middle">Open Source</text>
  </g>

  <!-- Accent line -->
  <line x1="560" y1="425" x2="970" y2="425" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>

  <text x="560" y="460" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="15" fill="#656d76">github.com/afraguas/EdrShield</text>
</svg>
